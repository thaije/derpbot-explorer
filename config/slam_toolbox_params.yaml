slam_toolbox:
  ros__parameters:
    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS params
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint   # odom child_frame_id = base_footprint (confirmed from sim)
    scan_topic: /derpbot_0/scan
    use_map_saver: false
    mode: mapping  # async online mapping

    # Time
    use_sim_time: true

    # Debugging
    debug_logging: false
    throttle_scans: 1
    scan_queue_size: 50  # Prevent message drops during startup
    transform_publish_period: 0.02  # 50 Hz TF publish
    map_update_interval: 5.0        # Save map to file every 5 s (optional)
    resolution: 0.05                # 5 cm grid resolution
    max_laser_range: 12.0           # DerpBot LiDAR max range
    minimum_travel_distance: 0.2     # Process a new scan node only after 0.2m of travel (default).
                                      # 0.05 caused constant scan processing → 10° yaw jitter in
                                      # feature-poor areas as Ceres optimizer oscillated between
                                      # nearly-equivalent yaw solutions at 60 Hz.
    minimum_travel_heading: 0.05     # ~3° heading change before processing a new scan (default).
                                      # 0.02 caused same jitter as above.

    # Scan matching — raise minimum_response to reject weak/ambiguous matches
    # (reduces map smearing near featureless walls/furniture)
    link_match_minimum_response_fine: 0.35  # with correct odometry, reject ambiguous matches; 0.10 too permissive → spurious matches rotated map
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.6

    # Correlation parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure
    loop_search_space_dimension: 4.0    # 8.0 allowed closures up to 8m away → 90° false
                                         # loop closures in right-angle geometry. 4m is still
                                         # generous for indoor spaces while reducing the search
                                         # space where ambiguous matches can survive.
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.3   # ~17°. 0.349 (∼20°) was too wide — in right-angle
                                        # environments a 90° match can score well enough to survive
                                        # the fine pass. Tightening reduces the chance of a quarter-turn
                                        # false closure being accepted.
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
